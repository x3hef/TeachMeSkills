{% extends 'booking/base.html' %}
{% load static %}
{% block content %}
<div style="text-align: center; margin-bottom: 50px;">
    <img src="{% static 'images/hero_logo.png' %}" alt="logo"
         style="max-width: 280px; animation: float 4s ease-in-out infinite;">
    <h1 style="font-size: 2.5rem; font-weight: 900; margin-top: 20px;">наши столики</h1>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; width: 100%; max-width: 1100px;">
    {% for table in tables %}
    <div class="glass-card" style="padding: 20px; max-width: 100%;">
        {% if table.image %}<img src="{{ table.image.url }}"
                                 style="width: 100%; border-radius: 15px; margin-bottom: 15px;">{% endif %}
        <h3>Столик №{{ table.number }}</h3>
        <p style="opacity: 0.6;">Мест: {{ table.seats }}</p>
        <a href="{% url 'create_reservation' %}" class="btn-main"
           style="display: block; text-decoration: none; text-align: center;">забронировать</a>
    </div>
    {% endfor %}
</div>

<style> @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } } </style>
{% endblock %}
