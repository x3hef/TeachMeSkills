{% extends "base.html" %}

{% block content %}

<div class="card-3d" style="max-width: 420px; margin: 60px auto;">

    <h2 class="mb-3">Регистрация</h2>

    <form method="POST" action="/register">

        <input class="mb-2" type="text" name="username" placeholder="Username">

        <input class="mb-3" type="password" name="password" placeholder="Password">

        <button class="btn-apple" type="submit">Создать аккаунт</button>

    </form>

    <div class="mt-3 text-center">
        <a href="/login">Уже есть аккаунт?</a>
    </div>

</div>

{% endblock %}
