<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Заметки</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
</head>

<body>

<div class="bg-3d">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="noise"></div>
</div>


<nav class="navbar px-4 py-3 d-flex justify-content-between">

    <a href="/" class="fw-bold text-decoration-none text-dark">
        ✏️ Заметки
    </a>

    {% if current_user.is_authenticated %}

    <div class="d-flex gap-3 align-items-center">

        <button class="theme-toggle" id="themeToggle">
            <span class="circle"></span>
            <span class="icon">🌙</span>
        </button>

        <a href="/logout" class="nav-link-custom logout">
            Logout
        </a>

    </div>

    {% endif %}

</nav>


<div class="page-wrapper">

    <div class="layout">


        <div class="main-content">
            {% block content %}{% endblock %}
        </div>

        <!-- RIGHT SIDEBAR -->
        <aside class="sidebar">

            <div class="tool-card">
                <h3>🌤 Погода</h3>
                <input id="cityInput" placeholder="Город">
                <button onclick="getWeather()">Показать</button>
                <p id="weatherResult"></p>
            </div>

            <div class="tool-card">
                <h3>💱 Курс USD → EUR</h3>
                <button onclick="getRate()">Обновить</button>
                <p id="rateResult">—</p>
            </div>

            <div class="tool-card">
                <h3>🧮 Калькулятор</h3>
                <input id="calcInput" placeholder="2+2*5">
                <button onclick="calc()">=</button>
                <p id="calcResult"></p>
            </div>

        </aside>

    </div>
</div>

<div id="editModal" class="modal-overlay">

    <div class="modal-box">

        <form id="editForm" method="POST">

            <h3>✏️ Редактировать заметку</h3>

            <input type="text" id="editTitle" name="title" required>

            <textarea id="editContent" name="content" required></textarea>

            <div class="modal-actions" style="display:flex; gap:10px; margin-top:10px;">

                <button class="btn-apple" type="submit">Сохранить</button>

                <button type="button" class="btn-cancel" onclick="closeEditModal()">
                    Отмена
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
