{% extends "base.html" %}

{% block title %}Вход | Loft Dynamics{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-wrapper">
        <div class="glass-card">
            <h2 class="page-title" style="font-size: 32px; text-align: center; margin-bottom: 5px;">Вход</h2>
            <p class="subtitle" style="text-align: center; margin-bottom: 35px;">Авторизация в системе управления</p>

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>Имя пользователя</label>
                    {{ form.username }}
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    {{ form.password }}
                </div>

                <button class="btn btn-primary" type="submit" style="width: 100%; padding: 18px; margin-top: 10px;">
                    <span class="btn-content">Войти в бокс</span>
                </button>
            </form>

            <div class="form-link">
                Нет аккаунта? <a href="/signup/">Зарегистрироваться</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
